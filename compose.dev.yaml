services:
    web:
        image: nginx:latest
        volumes:
            # Mount the application code for live updates
            - ./:/var/www
            # Mount the Nginx configuration file
            - ./docker/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "80:80"
        environment:
            - NGINX_HOST=localhost
        networks:
            - laravel-development
        depends_on:
            php-fpm:
                condition: service_started

    php-fpm:
        # For the php-fpm service, we will use our common PHP-FPM Dockerfile with the development target
        build:
            context: .
            dockerfile: ./docker/common/php-fpm/Dockerfile
            target: development
            args:
                UID: ${UID:-1000}                    # User ID (your local UID) to sync file permissions with host
                GID: ${GID:-1000}                    # Group ID (your local GID) to avoid permission issues on mounted volumes
                XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}  # Enable/disable Xdebug in PHP (true for development)
                XDEBUG_MODE: develop,coverage,debug,profile  # Xdebug modes: develop=enhanced var_dump, coverage=tests, debug=breakpoints, profile=CPU profiling
                XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}  # Host IP for Xdebug→IDE connection (host.docker.internal for Docker Desktop)
                XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}  # IDE key for authentication (DOCKER standard for Docker+PHPStorm)
                XDEBUG_LOG: /dev/stdout              # Xdebug logs output to container stdout (visible via docker logs)
                XDEBUG_LOG_LEVEL: 0                  # Log verbosity level (0=maximum detail, higher=fewer logs)
        env_file:
            # Load the environment variables from the Laravel application
            - .env
        user: "${UID:-1000}:${GID:-1000}"
        volumes:
            # Mount the application code for live updates
            - ./:/var/www
        networks:
            - laravel-development
        depends_on:
            postgres:
                condition: service_started # Wait for postgres to start

    workspace:
        # Custom image with PHP + Node.js + Composer + npm + artisan tools
        build:
            context: .
            dockerfile: ./docker/development/workspace/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
                XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
                XDEBUG_MODE: develop,coverage,debug,profile
                XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
                XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
                XDEBUG_LOG: /dev/stdout
                XDEBUG_LOG_LEVEL: 0
        tty: true # Enables an interactive terminal
        stdin_open: true # Keeps standard input open for 'docker exec'
        env_file:
            - .env
        volumes:
            - ./:/var/www
        networks:
            - laravel-development

    postgres:
        image: postgres:18
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            POSTGRES_USER: ${POSTGRES_USER:-laravel}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
        volumes:
            - postgres-data-development:/var/lib/postgresql
        networks:
            - laravel-development

    redis:
        image: redis:alpine
        networks:
            - laravel-development


networks:
    laravel-development:

volumes:
    postgres-data-development:
